<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<!-- kramdown turns $$...$$ into \(...\) (inline) or \[...\] (display) -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {delimiters: [{left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}]})"></script>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<main>
<header class="intro">
  <img src="{{ site.photo | relative_url }}" alt="Portrait of {{ site.title }}">
  <div>
    <h1>{{ site.title }}</h1>
    <p>{{ site.role }}<br>{{ site.affiliation }}</p>
    <a class="pill" href="{{ site.cv | relative_url }}">CV</a>
  </div>
</header>
{{ content }}
</main>
</body>
</html>
